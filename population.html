<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population - Algeria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <nav class="navbar">
        <a href="MAPS OF ALGERIA.html">Home</a>
        <a href="population.html">Population</a>
        <a href="statistic.html">Economy</a>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search..." oninput="handleSearch()" autocomplete="off" />
            <ul id="suggestions" class="suggestions"></ul>
        </div>
    </nav>

    <main style="padding: 20px; width: 100%; max-width: 900px;">
        <h1>Population Statistics</h1>
        <p style="margin-top: 8px; font-size: 1.05em;">Historical evolution of the Algerian population (in millions)</p>
        
        <canvas id="histogram" width="420" height="400"></canvas>
    </main>

    <footer>
        <p>Explore Algeria - A Rich and Beautiful Country</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const canvas = document.getElementById('histogram');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            const data = [
                { label: "1990", value: 30 },
                { label: "2000", value: 50 },
                { label: "2020", value: 40 }
            ];

            // Y-Axis
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(50, 350);
            ctx.lineTo(50, 50);
            ctx.stroke();

            // Y-Axis Arrow
            ctx.beginPath();
            ctx.moveTo(45, 60);
            ctx.lineTo(50, 50);
            ctx.lineTo(55, 60);
            ctx.stroke();

            // X-Axis
            ctx.beginPath();
            ctx.moveTo(50, 350);
            ctx.lineTo(380, 350);
            ctx.stroke();

            // X-Axis Arrow
            ctx.beginPath();
            ctx.moveTo(370, 345);
            ctx.lineTo(380, 350);
            ctx.lineTo(370, 355);
            ctx.stroke();

            // Draw Bars
            data.forEach((bar, index) => {
                const x = 100 + index * 90;
                const barHeight = bar.value * 5;
                const y = 350 - barHeight;

                // Bar Fill
                ctx.fillStyle = "#3498db";
                ctx.fillRect(x, y, 50, barHeight);

                // Bar Border
                ctx.strokeStyle = "#2980b9";
                ctx.strokeRect(x, y, 50, barHeight);

                // Labels
                ctx.fillStyle = "#000000";
                ctx.font = "bold 13px Arial";
                ctx.fillText(bar.label, x + 8, 370);
                ctx.fillText(bar.value + "M", x + 10, y - 10);
            });

            // Axis Titles
            ctx.fillStyle = "#000000";
            ctx.font = "bold 14px Arial";
            ctx.fillText("Population (M)", 10, 35);
            ctx.fillText("Year", 375, 375);
        }
    </script>
</body>
</html>
