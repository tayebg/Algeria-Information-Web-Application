<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algeria Information - Map & Flag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <nav class="navbar">
        <a href="MAPS OF ALGERIA.html">Home</a>
        <a href="population.html">Population</a>
        <a href="statistic.html">Economy</a>
        
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search..." oninput="handleSearch()" autocomplete="off" />
            <ul id="suggestions" class="suggestions"></ul>

    </nav>
  
    <main style="padding: 20px; width: 100%; max-width: 1200px;">
        <h1>MAP AND FLAG</h1>

        <div id="map-section">

    <footer>
        <p>Explore Algeria - A Rich and Beautiful Country</p>
